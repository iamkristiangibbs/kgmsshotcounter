<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Counter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shot Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1791414054">
</head>
<body>
<main>
  <header class="brand">
    <div class="logo">🍻</div>
    <h1>Shot Counter</h1>
  </header>
  <p class="sub">Start a session, send friends the link, and log every drink as it happens.</p>
  <div id="notice"></div>
  <div id="installHint" class="card hint-card hidden">
      <div class="hint-title">📲 Get the app</div>
      <div class="hint-body" id="installBody"></div>
      <button id="hintClose" class="x" aria-label="Dismiss">✕</button>
    </div>


  <section id="home">
    <div class="card">
      <label for="nm">Your username</label>
      <input id="nm" maxlength="24" placeholder="e.g. kristian" autocomplete="off">
      <p class="hint">Use the same username to get back into your session later.</p>
    </div>
    <div class="card">
      <label for="sn">Start a new session</label>
      <input id="sn" maxlength="40" placeholder="Name it, e.g. Friday night" autocomplete="off">
      <button id="create" class="btn pink">Create session</button>
    </div>
    <div class="card">
      <label for="jc">Join friends</label>
      <input id="jc" class="codein" maxlength="5" placeholder="ABCDE" autocomplete="off">
      <div id="jpreview" class="preview"></div>
      <button id="join" class="btn white">Join with code</button>
    </div>
    </section>

  <section id="session" class="hidden">
    <div class="hero">
      <div class="top">
        <div>
          <div class="sname" id="sname"></div>
          <div class="live" id="people"></div>
        </div>
        <div class="acts"><button id="rename" class="btn small white">Rename</button><button id="leave" class="btn small white">Leave</button></div>
      </div>
      <div class="codebox">
        <div class="code" id="scode"></div>
        <button id="share" class="btn small yellow">Share link</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="tShot">0</b><span>🥃 Shots</span></div>
        <div class="stat"><b id="tBeer">0</b><span>🍺 Beers</span></div>
        <div class="stat"><b id="tWater">0</b><span>💧 Water</span></div>
      </div>
      <button id="del" class="btn small danger hidden">Delete session</button>
    </div>

    <h2>Your drinks</h2>
    <div class="card" id="mine"></div>

    <h2>Everyone's progress</h2>
    <div id="members"></div>
    <div class="spacer"></div>

    <div class="dock">
      <div class="dock-in">
        <select id="type" aria-label="Drink type">
          <option value="shot">🥃 Shot</option>
          <option value="beer">🍺 Beer</option>
          <option value="water">💧 Water</option>
        </select>
        <button id="log" class="btn pink">+ Log it</button>
      </div>
    </div>
  </section>
  <input id="photoIn" type="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  <footer class="foot">Created by iamkristiangibbs</footer>
</main>
<script type="module" src="app.js?v=1791414054"></script>
</body>
</html>
